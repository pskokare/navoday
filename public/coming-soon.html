<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon | Your Hospital</title>
  <meta name="description" content="Our hospital website is coming soon." />

  <style>
    :root {
      --orange: #F08818;
      --magenta: #E01078;
      --ink: #241729;
      --muted: #766d78;
      --surface: rgba(255, 255, 255, 0.75);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(240, 136, 24, 0.17), transparent 24rem),
        radial-gradient(circle at 84% 80%, rgba(224, 16, 120, 0.14), transparent 27rem),
        radial-gradient(circle at 82% 14%, rgba(255, 211, 145, 0.28), transparent 18rem),
        linear-gradient(135deg, #fffaf6 0%, #ffffff 48%, #fff8fc 100%);
    }

    .page {
      min-height: 100vh;
      position: relative;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      isolation: isolate;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.25;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
    }

    .brand {
      position: absolute;
      top: 28px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: white;
      font-size: 23px;
      background: linear-gradient(135deg, var(--orange), var(--magenta));
      box-shadow: 0 10px 22px rgba(224, 16, 120, 0.22);
    }

    .brand span {
      font-size: 1.05rem;
    }

    .card {
      width: min(680px, 100%);
      text-align: center;
      padding: 58px 40px 42px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;
      background: var(--surface);
      box-shadow:
        0 24px 70px rgba(73, 35, 62, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 22px;
      font-size: 33px;
     
      animation: gentle-float 3.5s ease-in-out infinite;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--magenta);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 570px;
      margin: 0 auto;
      font-size: clamp(2.25rem, 6vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: -0.065em;
    }

    h1 span {
      background: linear-gradient(100deg, var(--orange), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      max-width: 460px;
      margin: 22px auto 28px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .notify-form {
      display: flex;
      max-width: 430px;
      margin: auto;
      padding: 6px;
      border: 1px solid rgba(92, 47, 79, 0.1);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 12px 28px rgba(80, 32, 61, 0.07);
    }

    .notify-form input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 13px 12px;
      color: var(--ink);
      font: inherit;
      background: transparent;
    }

    .notify-form input::placeholder { color: #aaa1aa; }

    .notify-form button {
      flex: none;
      border: 0;
      border-radius: 13px;
      padding: 13px 19px;
      cursor: pointer;
      color: #fff;
      font: inherit;
      font-weight: 750;
      background: linear-gradient(110deg, var(--orange), var(--magenta));
      box-shadow: 0 7px 16px rgba(224, 16, 120, 0.25);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .notify-form button:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(224, 16, 120, 0.3);
    }

    #message {
      min-height: 21px;
      margin: 14px 0 0;
      color: var(--magenta);
      font-size: 0.9rem;
      font-weight: 650;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .socials a {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(97, 58, 83, 0.1);
      border-radius: 50%;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.78);
      transition: 180ms ease;
    }

    .socials a:hover {
      color: white;
      border-color: transparent;
      background: var(--magenta);
      transform: translateY(-3px);
    }

    .floating {
      position: absolute;
      z-index: -1;
      user-select: none;
      filter: drop-shadow(0 12px 12px rgba(79, 34, 59, 0.14));
      animation: float 5s ease-in-out infinite;
    }

    .one   { top: 22%; left: 11%; font-size: 3rem; animation-delay: -1s; }
    .two   { top: 17%; right: 12%; font-size: 2.8rem; animation-delay: -3s; }
    .three { bottom: 19%; left: 12%; font-size: 3.2rem; animation-delay: -2s; }
    .four  { bottom: 18%; right: 11%; font-size: 3.1rem; animation-delay: -4s; }
    .five  { top: 52%; right: 5%; font-size: 2rem; animation-delay: -1.5s; }

    .footer {
      position: absolute;
      bottom: 24px;
      color: #918891;
      font-size: 0.82rem;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-16px) rotate(4deg); }
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (max-width: 640px) {
      body { overflow: auto; }
      .page { padding: 92px 18px 70px; }
      .brand { top: 20px; left: 20px; }
      .card { padding: 40px 20px 32px; border-radius: 26px; }
      .notify-form { flex-direction: column; gap: 5px; }
      .notify-form button { width: 100%; }
      .one { left: 4%; top: 17%; font-size: 2.2rem; }
      .two { right: 4%; top: 13%; font-size: 2rem; }
      .three { bottom: 10%; left: 4%; font-size: 2.2rem; }
      .four { bottom: 10%; right: 4%; font-size: 2.2rem; }
      .five { display: none; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="grain"></div>

 

    <div class="floating one">🩺</div>
    <div class="floating two">💗</div>
    <div class="floating three">🌿</div>
    <div class="floating four">✨</div>
    <div class="floating five">🩹</div>

    <section class="card" aria-labelledby="main-heading">
      <div class="icon">
        <img src="images/navoday-logo.png" alt="Logo" style="height: 54px; width: auto;" />
      </div>
      <p class="eyebrow">We’re preparing something better</p>

      <h1 id="main-heading">
        Care is almost <span>here.</span>
      </h1>

      <p class="description">
        Our new hospital website is on its way—making it easier to find trusted
        care, connect with specialists, and stay informed.
      </p>

      

      <p id="message" role="status" aria-live="polite"></p>

      <!-- <nav class="socials" aria-label="Social media">
        <a href="#" aria-label="Facebook">f</a>
        <a href="#" aria-label="Instagram">◎</a>
        <a href="#" aria-label="LinkedIn">in</a>
      </nav> -->
    </section>

    <footer class="footer">© 2026 Your Hospital. Compassion in every step.</footer>
  </main>

  <script>
    const form = document.getElementById("notifyForm");
    const email = document.getElementById("email");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!email.value || !email.checkValidity()) {
        message.textContent = "Please enter a valid email address.";
        return;
      }

      message.textContent = "Thank you — we’ll let you know when we’re live.";
      form.reset();
    });
  </script>
</body>
</html>
